# QubitvaleTrading 全局配置（Phase 0）
project: QubitvaleTrading
store_dir: data/store

# ---- 历史数据回填（Binance Vision，免费官方批量数据）----
symbols: [BTCUSDT, ETHUSDT, SOLUSDT]
markets: [spot, um]          # um = USDT-M 永续合约
timeframes: [1h, 4h, 1d]
start_month: "2019-01"       # 各币种实际起点自动探测（上市前月份 404 会被记录并跳过）
funding_start_month: "2019-09"
download_workers: 12
verify_checksums: true       # R4: 校验 Binance Vision 官方 SHA-256

# ---- Bitget 实时源（CCXT，公共端点无需密钥）----
bitget:
  spot_symbols: ["BTC/USDT", "ETH/USDT", "SOL/USDT"]
  swap_symbols: ["BTC/USDT:USDT", "ETH/USDT:USDT", "SOL/USDT:USDT"]
  funding_history_pages: 5   # 每页 100 条，5 页 ≈ 166 天（8h 结算）

# ---- 新闻采集 ----
news:
  rss_feeds:
    coindesk: "https://www.coindesk.com/arc/outboundfeeds/rss/"
    cointelegraph: "https://cointelegraph.com/rss"
    theblock: "https://www.theblock.co/rss.xml"
    wublockchain: "https://wublock.substack.com/feed"
  gdelt_query: "(bitcoin OR ethereum OR cryptocurrency OR stablecoin)"
  gdelt_timespan: "12h"
  gdelt_maxrecords: 100

# ---- Phase 2 模拟盘（多账本，2026-07-13 起）----
paper:
  fee_bps_side: 10                # 现货 taker（保守；BGB 抵扣可到 8）
  slip_floor_bps: 1.0
  rebalance_threshold: 0.02       # |目标-当前| 权重差超过 2% 才调仓（控制漂移换手）
  min_trade_usdt: 10
  books:                          # 每本账独立资金/账本/基准；策略见 strategies/registry.py
    donchian_ensemble:
      initial_capital_usdt: 10000
      start_date: "2026-07-12"    # UTC
    tsmom_ensemble:
      initial_capital_usdt: 10000
      start_date: "2026-07-13"    # UTC；预注册条款见 strategies/tsmom_ensemble.py 文件头

# ---- 跨资产日线（DL 研究计划 §5；SPY/QQQ/GLD ETF + VIX 指数）----
cross_asset:
  etf_symbols: [SPY, QQQ, GLD]
  index_symbols: [VIX]
  availability_floor_utc: "21:30"   # 完成会话最早可用时间（覆盖 EST/EDT 收盘 + VIX 16:15 ET 终值）
  max_stale_sessions: 1             # 超过 1 个已收盘 NYSE 会话未入库 → stale（fail-closed 禁加仓）
  backfill_start: "2018-09-01"      # 90 天序列回看 + 指标 warmup，先于 2019-01 加密史

# ---- E2 前瞻影子测试（预注册：research/reports/dl_trial_ledger.md；非账本）----
dl_shadow:
  model_id: "e2_shadow_2026-07-14"  # scripts.freeze_dl_shadow 产物；重训后更新

intel:
  event_gate_lookahead_hours: 36  # 事件前 36h 起禁开新仓（日频粒度下覆盖"前2h"精神）
  event_gate_cooldown_hours: 1    # 事件后 1h 解除
  risk_flags_ttl_hours: 24        # R6: 旗过期视为"状态未知"→ 保守禁加仓
  risk_flag_no_add_severity: 4    # 负面 sev≥4：该资产禁加仓
  risk_flag_halve_severity: 5     # 负面 sev≥5：该资产目标减半
  scorer_max_items: 80
  scorer_window_hours: 48
  scorer_rss_reserve: 40          # guarantee curated RSS >= min(this, available) slots so the GDELT firehose can't crowd it out
  scorer_dedup_jaccard: 0.6       # near-duplicate collapse: merge headlines with >= this token-overlap (keeps RSS copy)
  # ---- ETF-flow gate (BTC/ETH US spot ETFs; SOL has no ETF) — risk-off only, restricts adds ----
  etf_lookback_days: 5            # trailing window (settled days) for the net-flow regime
  etf_min_days: 3                 # need >= this many days in window, else no gate for that asset
  etf_outflow_no_add_usd_m: 300   # trailing net outflow >= $300M -> block adds for that asset
  etf_outflow_trim_usd_m: 1000    # trailing net outflow >= $1000M -> halve that asset's target

# ---- 数据质检门槛（Phase 0 放行标准，来自调研报告 §6.6）----
qc:
  max_missing_pct: 0.2           # 每条 K 线序列缺口率上限（%）
  max_dup: 0                     # 重复时间戳
  max_ohlc_violations: 0         # low<=min(o,c)<=max(o,c)<=high 违例
  cross_window_days: 30          # 跨源校验窗口（最近 N 个已结算日）
  cross_max_diff_pct: 0.5        # 任意日线收盘 vs CoinGecko/Coinbase 最大偏差（%）
  freshness_max_age_days: 3      # 日线数据最迟允许滞后（Vision 日度文件 T+1 发布）

# 跨源校验的符号映射
cross_source:
  BTCUSDT: {coingecko: bitcoin, coinbase: BTC-USD}
  ETHUSDT: {coingecko: ethereum, coinbase: ETH-USD}
  SOLUSDT: {coingecko: solana, coinbase: SOL-USD}
